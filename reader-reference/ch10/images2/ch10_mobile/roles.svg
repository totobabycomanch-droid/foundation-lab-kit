<svg xmlns="http://www.w3.org/2000/svg" width="360" height="696" viewBox="0 0 360 696" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">주문과 연결된 업무의 역할</title><desc id="desc">역할 구분이며, 위아래가 처리 순서는 아닙니다.. 주문: 현재 상태와 주문 당시 단가, 상태 변경 이력과 업무 사건 기록; 상품·가격: 상품 기본 정보, 기간별 가격 이력 관리; 재고: 입고·출고 증감 기록, 현재고·가용 재고는 정책에 따라 계산; 결제·정산: 승인·취소·정산 근거 보존, 10장 주문 API에는 구현하지 않음; 배송: 배송 상태와 인계 기록, 10장 주문 API에는 구현하지 않음</desc>
<rect width="360" height="696" fill="#fff"/>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif">
<text x="18" y="30" font-size="21" font-weight="700" fill="#172739">주문과 연결된 업무의 역할</text>
<text x="18" y="62" font-size="15" fill="#445368">역할 구분이며, 위아래가 처리 순서는 아닙니다.</text>
<rect x="14" y="88" width="332" height="102" rx="8" fill="#fff" stroke="#a9480c" stroke-width="1.5"/><path d="M22 88 H338 Q346 88 346 96 V126 H14 V96 Q14 88 22 88" fill="#a9480c"/><text x="28" y="114" font-size="18" font-weight="700" fill="#fff">주문</text><text x="28" y="152" font-size="16" fill="#172739">현재 상태와 주문 당시 단가</text><text x="28" y="178" font-size="16" fill="#172739">상태 변경 이력과 업무 사건 기록</text><rect x="14" y="208" width="332" height="102" rx="8" fill="#fff" stroke="#175b91" stroke-width="1.5"/><path d="M22 208 H338 Q346 208 346 216 V246 H14 V216 Q14 208 22 208" fill="#175b91"/><text x="28" y="234" font-size="18" font-weight="700" fill="#fff">상품·가격</text><text x="28" y="272" font-size="16" fill="#172739">상품 기본 정보</text><text x="28" y="298" font-size="16" fill="#172739">기간별 가격 이력 관리</text><rect x="14" y="328" width="332" height="102" rx="8" fill="#fff" stroke="#176d45" stroke-width="1.5"/><path d="M22 328 H338 Q346 328 346 336 V366 H14 V336 Q14 328 22 328" fill="#176d45"/><text x="28" y="354" font-size="18" font-weight="700" fill="#fff">재고</text><text x="28" y="392" font-size="16" fill="#172739">입고·출고 증감 기록</text><text x="28" y="418" font-size="16" fill="#172739">현재고·가용 재고는 정책에 따라 계산</text><rect x="14" y="448" width="332" height="102" rx="8" fill="#fff" stroke="#445368" stroke-width="1.5"/><path d="M22 448 H338 Q346 448 346 456 V486 H14 V456 Q14 448 22 448" fill="#445368"/><text x="28" y="474" font-size="18" font-weight="700" fill="#fff">결제·정산</text><text x="28" y="512" font-size="16" fill="#172739">승인·취소·정산 근거 보존</text><text x="28" y="538" font-size="16" fill="#172739">10장 주문 API에는 구현하지 않음</text><rect x="14" y="568" width="332" height="102" rx="8" fill="#fff" stroke="#445368" stroke-width="1.5"/><path d="M22 568 H338 Q346 568 346 576 V606 H14 V576 Q14 568 22 568" fill="#445368"/><text x="28" y="594" font-size="18" font-weight="700" fill="#fff">배송</text><text x="28" y="632" font-size="16" fill="#172739">배송 상태와 인계 기록</text><text x="28" y="658" font-size="16" fill="#172739">10장 주문 API에는 구현하지 않음</text>
</g></svg>
