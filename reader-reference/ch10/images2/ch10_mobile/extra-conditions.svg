<svg xmlns="http://www.w3.org/2000/svg" width="360" height="576" viewBox="0 0 360 576" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">별도로 구현해야 할 조건</title><desc id="desc">아래 항목은 이번 저장·롤백의 보장 밖입니다.. 회사 경계: 인증된 회사·역할로 접근 제한, 요청 본문의 회사 ID만 믿지 않기; 동시 출고: 원장 합계 조회만으로는 부족, 잠금·조건부 갱신 등 별도 설계; 거래 보존: 취소·역거래와 삭제 제한 구분, 상태·시각 컬럼만으로 보장되지 않음; 중복 요청: 같은 요청의 반복 처리를 막을 키, 처리 결과 재사용 정책</desc>
<rect width="360" height="576" fill="#fff"/>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif">
<text x="18" y="30" font-size="21" font-weight="700" fill="#172739">별도로 구현해야 할 조건</text>
<text x="18" y="62" font-size="15" fill="#445368">아래 항목은 이번 저장·롤백의 보장 밖입니다.</text>
<rect x="14" y="88" width="332" height="102" rx="8" fill="#fff" stroke="#175b91" stroke-width="1.5"/><path d="M22 88 H338 Q346 88 346 96 V126 H14 V96 Q14 88 22 88" fill="#175b91"/><text x="28" y="114" font-size="18" font-weight="700" fill="#fff">회사 경계</text><text x="28" y="152" font-size="16" fill="#172739">인증된 회사·역할로 접근 제한</text><text x="28" y="178" font-size="16" fill="#172739">요청 본문의 회사 ID만 믿지 않기</text><rect x="14" y="208" width="332" height="102" rx="8" fill="#fff" stroke="#176d45" stroke-width="1.5"/><path d="M22 208 H338 Q346 208 346 216 V246 H14 V216 Q14 208 22 208" fill="#176d45"/><text x="28" y="234" font-size="18" font-weight="700" fill="#fff">동시 출고</text><text x="28" y="272" font-size="16" fill="#172739">원장 합계 조회만으로는 부족</text><text x="28" y="298" font-size="16" fill="#172739">잠금·조건부 갱신 등 별도 설계</text><rect x="14" y="328" width="332" height="102" rx="8" fill="#fff" stroke="#a9480c" stroke-width="1.5"/><path d="M22 328 H338 Q346 328 346 336 V366 H14 V336 Q14 328 22 328" fill="#a9480c"/><text x="28" y="354" font-size="18" font-weight="700" fill="#fff">거래 보존</text><text x="28" y="392" font-size="16" fill="#172739">취소·역거래와 삭제 제한 구분</text><text x="28" y="418" font-size="16" fill="#172739">상태·시각 컬럼만으로 보장되지 않음</text><rect x="14" y="448" width="332" height="102" rx="8" fill="#fff" stroke="#445368" stroke-width="1.5"/><path d="M22 448 H338 Q346 448 346 456 V486 H14 V456 Q14 448 22 448" fill="#445368"/><text x="28" y="474" font-size="18" font-weight="700" fill="#fff">중복 요청</text><text x="28" y="512" font-size="16" fill="#172739">같은 요청의 반복 처리를 막을 키</text><text x="28" y="538" font-size="16" fill="#172739">처리 결과 재사용 정책</text>
</g></svg>
