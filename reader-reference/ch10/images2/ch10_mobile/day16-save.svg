<svg xmlns="http://www.w3.org/2000/svg" width="360" height="978" viewBox="0 0 360 978" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">Day 16 발주 저장 흐름</title><desc id="desc">HTTP 처리와 DB의 원자 저장을 구분합니다.. 가맹점 사용자 요청: 인증 + Idempotency-Key, 요청 본문: master / details; HTTP 요청 처리: purchase.py: 회사·역할 확인; 입력 해석·업무 판단: 인증된 회사·역할로 판단, 발주 저장 계획 생성; 마감 조건 확인: 발주를 저장할 수 있는 날짜인지 검사; DB RPC 호출: 여기서 하나의 DB 트랜잭션으로 처리; 저장 시점 재검증: JWT 회사·역할 확인, 서버가 상품 단가·배송지 결정; 발주·상세·감사 함께 저장: purchaseorder10, purchaseorder20, audit_logs; 결과 반환: HTTP 200 + 저장 결과</desc>
<rect width="360" height="978" fill="#fff"/>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif">
<text x="18" y="30" font-size="21" font-weight="700" fill="#172739">Day 16 발주 저장 흐름</text>
<text x="18" y="62" font-size="15" fill="#445368">HTTP 처리와 DB의 원자 저장을 구분합니다.</text>
