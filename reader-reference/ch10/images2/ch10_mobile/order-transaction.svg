<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">주문 생성의 정상 저장 순서</title><desc id="desc">참고 구현은 품목마다 2-1~2-3을 반복합니다. 주문 요청: POST /orders; 1. 주문 마스터 저장: orders: 회사 ID·CREATED 상태, 이후 쓰기는 같은 연결에서 수행; 2-1. 유효한 가격 조회: product_prices에서 현재 단가 조회; 2-1. 주문 당시 단가 저장: order_items에 수량·단가 저장; 2-2. 재고 부족 검사: stock_ledger의 증감 합계 조회; 2-3. 재고 차감 기록: stock_ledger에 음수 증감 추가; 3. 사건·초기 상태 기록: order_events: OrderCreated, order_state_history: 초기 상태; 4. 모두 성공하면 COMMIT: 함께 확정한 뒤 200과 주문 ID 반환</desc>
<rect width="360" height="900" fill="#fff"/>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif">
<text x="18" y="30" font-size="21" font-weight="700" fill="#172739">주문 생성의 정상 저장 순서</text>
<text x="18" y="62" font-size="15" fill="#445368">참고 구현은 품목마다 2-1~2-3을 반복합니다.</text>
<rect x="14" y="88" width="332" height="76" rx="8" fill="#fff" stroke="#175b91" stroke-width="1.5"/><path d="M22 88 H338 Q346 88 346 96 V126 H14 V96 Q14 88 22 88" fill="#175b91"/><text x="28" y="114" font-size="18" font-weight="700" fill="#fff">주문 요청</text><text x="28" y="152" font-size="16" fill="#172739">POST /orders</text><path d="M180 165 V178 M175 173 L180 178 L185 173" fill="none" stroke="#445368" stroke-width="1.5"/><rect x="14" y="182" width="332" height="102" rx="8" fill="#fff" stroke="#a9480c" stroke-width="1.5"/><path d="M22 182 H338 Q346 182 346 190 V220 H14 V190 Q14 182 22 182" fill="#a9480c"/><text x="28" y="208" font-size="18" font-weight="700" fill="#fff">1. 주문 마스터 저장</text><text x="28" y="246" font-size="16" fill="#172739">orders: 회사 ID·CREATED 상태</text><text x="28" y="272" font-size="16" fill="#172739">이후 쓰기는 같은 연결에서 수행</text><path d="M180 285 V298 M175 293 L180 298 L185 293" fill="none" stroke="#445368" stroke-width="1.5"/><rect x="14" y="302" width="332" height="76" rx="8" fill="#fff" stroke="#175b91" stroke-width="1.5"/><path d="M22 302 H338 Q346 302 346 310 V340 H14 V310 Q14 302 22 302" fill="#175b91"/><text x="28" y="328" font-size="18" font-weight="700" fill="#fff">2-1. 유효한 가격 조회</text><text x="28" y="366" font-size="16" fill="#172739">product_prices에서 현재 단가 조회</text><path d="M180 379 V392 M175 387 L180 392 L185 387" fill="none" stroke="#445368" stroke-width="1.5"/><rect x="14" y="396" width="332" height="76" rx="8" fill="#fff" stroke="#a9480c" stroke-width="1.5"/><path d="M22 396 H338 Q346 396 346 404 V434 H14 V404 Q14 396 22 396" fill="#a9480c"/><text x="28" y="422" font-size="18" font-weight="700" fill="#fff">2-1. 주문 당시 단가 저장</text><text x="28" y="460" font-size="16" fill="#172739">order_items에 수량·단가 저장</text><path d="M180 473 V486 M175 481 L180 486 L185 481" fill="none" stroke="#445368" stroke-width="1.5"/><rect x="14" y="490" width="332" height="76" rx="8" fill="#fff" stroke="#176d45" stroke-width="1.5"/><path d="M22 490 H338 Q346 490 346 498 V528 H14 V498 Q14 490 22 490" fill="#176d45"/><text x="28" y="516" font-size="18" font-weight="700" fill="#fff">2-2. 재고 부족 검사</text><text x="28" y="554" font-size="16" fill="#172739">stock_ledger의 증감 합계 조회</text><path d="M180 567 V580 M175 575 L180 580 L185 575" fill="none" stroke="#445368" stroke-width="1.5"/><rect x="14" y="584" width="332" height="76" rx="8" fill="#fff" stroke="#176d45" stroke-width="1.5"/><path d="M22 584 H338 Q346 584 346 592 V622 H14 V592 Q14 584 22 584" fill="#176d45"/><text x="28" y="610" font-size="18" font-weight="700" fill="#fff">2-3. 재고 차감 기록</text><text x="28" y="648" font-size="16" fill="#172739">stock_ledger에 음수 증감 추가</text><path d="M180 661 V674 M175 669 L180 674 L185 669" fill="none" stroke="#445368" stroke-width="1.5"/><rect x="14" y="678" width="332" height="102" rx="8" fill="#fff" stroke="#a9480c" stroke-width="1.5"/><path d="M22 678 H338 Q346 678 346 686 V716 H14 V686 Q14 678 22 678" fill="#a9480c"/><text x="28" y="704" font-size="18" font-weight="700" fill="#fff">3. 사건·초기 상태 기록</text><text x="28" y="742" font-size="16" fill="#172739">order_events: OrderCreated</text><text x="28" y="768" font-size="16" fill="#172739">order_state_history: 초기 상태</text><path d="M180 781 V794 M175 789 L180 794 L185 789" fill="none" stroke="#445368" stroke-width="1.5"/><rect x="14" y="798" width="332" height="76" rx="8" fill="#fff" stroke="#445368" stroke-width="1.5"/><path d="M22 798 H338 Q346 798 346 806 V836 H14 V806 Q14 798 22 798" fill="#445368"/><text x="28" y="824" font-size="18" font-weight="700" fill="#fff">4. 모두 성공하면 COMMIT</text><text x="28" y="862" font-size="16" fill="#172739">함께 확정한 뒤 200과 주문 ID 반환</text>
</g></svg>
